name: CI Roadie Monorepo

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==========================================
  # PIPELINE BACKEND (Symfony)
  # ==========================================
  back-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, zip
          coverage: none

      - name: Cache Vendor
        id: cache-vendor
        uses: actions/cache@v5
        with:
          path: back/vendor
          key: ${{ runner.os }}-back-vendor-${{ hashFiles('back/composer.lock') }}

      - name: Composer Install
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: |
          cp .env.dist .env
          composer install --no-progress --prefer-dist --optimize-autoloader

  back-tests:
    needs: back-dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Restore Vendor
        uses: actions/cache@v5
        with:
          path: back/vendor
          key: ${{ runner.os }}-back-vendor-${{ hashFiles('back/composer.lock') }}
          fail-on-cache-miss: true

      - name: Run Linters & Tests
        run: |
          php bin/console lint:yaml config
          php bin/console lint:twig templates
          vendor/bin/phpunit

  back-docker:
    needs: back-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Back Production Image
        run: docker build -f back/Dockerfile --target prod -t roadie-back:latest ./back


  # ==========================================
  # PIPELINE FRONTEND (React / Vite)
  # ==========================================
  # ==========================================
  # PIPELINE FRONTEND (React / Vite)
  # ==========================================
  front-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node & Cache
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install Dependencies
        run: npm ci

  # 1️⃣ LINT
  front-lint:
    needs: front-dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node & Cache
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

  # 2️⃣ TYPECHECK (Compilateur TypeScript)
  front-typecheck:
    needs: front-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node & Cache
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Typecheck
        run: npx tsc --noEmit # Vérifie juste la compilation TS sans faire de build Vite

  # 3️⃣ TESTS UNITAIRES (Vitest)
  front-tests:
    needs: front-typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node & Cache
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests (Vitest)
        run: npm run test -- --run

  # 4️⃣ BUILD FRONTEND
  front-build:
    needs: front-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node & Cache
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npx vite build

  # 5️⃣ DOCKER BUILD
  front-docker:
    needs: front-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Front Production Image
        run: docker build -f front/Dockerfile --target prod -t roadie-front:latest ./front