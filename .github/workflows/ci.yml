name: CI Roadie Monorepo

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  back-install:
    name: Back - Install dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, zip
          coverage: none

      - name: Cache vendor and Composer cache
        id: cache-vendor
        uses: actions/cache@v5
        with:
          path: |
            back/vendor
            ~/.composer/cache
          key: ${{ runner.os }}-back-vendor-${{ hashFiles('back/composer.lock') }}

      - name: Install dependencies
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: |
          cp .env.dist .env
          composer install --no-progress --prefer-dist --optimize-autoloader

  back-lint:
    name: Back - Lint
    needs: back-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, zip
          coverage: none

      - name: Restore vendor and Composer cache
        uses: actions/cache@v5
        with:
          path: |
            back/vendor
            ~/.composer/cache
          key: ${{ runner.os }}-back-vendor-${{ hashFiles('back/composer.lock') }}
          fail-on-cache-miss: true

      - name: Run linter
        run: |
          php bin/console lint:yaml config
          php bin/console lint:twig templates

  back-tests:
    name: Back - Tests
    needs: back-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, zip
          coverage: none

      - name: Restore vendor and Composer cache
        uses: actions/cache@v5
        with:
          path: |
            back/vendor
            ~/.composer/cache
          key: ${{ runner.os }}-back-vendor-${{ hashFiles('back/composer.lock') }}
          fail-on-cache-miss: true

      - name: Run tests
        run: vendor/bin/phpunit

  front-install:
    name: Front - Install dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

  front-lint:
    name: Front - Lint
    needs: front-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  front-tests:
    name: Front - Tests
    needs: front-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --run

  docker-build:
    name: Build production Docker image
    needs: [back-tests, front-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build --build-arg APP_ENV=prod -t roadie:latest .
