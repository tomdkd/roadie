name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  # --- BACKEND ---
  back-install:
    name: Back - Install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, zip
          coverage: none

      - name: Cache vendor and Composer cache
        id: cache-vendor
        uses: actions/cache@v5
        with:
          path: |
            back/vendor
            ~/.composer/cache
          key: ${{ runner.os }}-back-vendor-${{ hashFiles('back/composer.lock') }}

      - name: Prepare .env
        run: cp .env.dist .env || true

      - name: Install dependencies
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: composer install --no-progress --prefer-dist --optimize-autoloader --no-scripts

  back-lint:
    name: Back - Lint
    needs: back-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, zip
          coverage: none

      - name: Restore vendor cache
        uses: actions/cache@v5
        with:
          path: |
            back/vendor
            ~/.composer/cache
          key: ${{ runner.os }}-back-vendor-${{ hashFiles('back/composer.lock') }}
          fail-on-cache-miss: true

      - name: Run linter
        run: |
          cp .env.dist .env || true
          php bin/console lint:yaml config
          php bin/console lint:twig templates

  back-tests:
    name: Back - Tests
    needs: back-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, zip
          coverage: none

      - name: Restore vendor cache
        uses: actions/cache@v5
        with:
          path: |
            back/vendor
            ~/.composer/cache
          key: ${{ runner.os }}-back-vendor-${{ hashFiles('back/composer.lock') }}
          fail-on-cache-miss: true

      - name: Run tests
        run: |
          cp .env.dist .env || true
          vendor/bin/phpunit

  # --- FRONTEND ---
  front-install:
    name: Front - Install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

  front-lint:
    name: Front - Lint
    needs: front-install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

  front-tests:
    name: Front - Tests
    needs: front-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./front
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --run

  # --- DOCKER BUILD & RELEASE OPTIMISÉ ---
  docker-release:
    name: Build Docker & Manage Release
    needs: [back-tests, front-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # Checkout rapide sans historique lourd
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 1. Calcul des tags et des stratégies d'architecture
      - name: Compute Tag and Release Type
        id: vars
        run: |
          EVENT_NAME="${{ github.event_name }}"
          PR_NUM="${{ github.event.number }}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH="${{ github.base_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi

          BASE_VERSION=$(jq -r '.version // "1.0.0"' front/package.json)
          IS_PRERELEASE="true"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$BRANCH" = "develop" ]; then
              TAG="pr-rc-${PR_NUM}"
            else
              TAG="master-${BASE_VERSION}-rc.${PR_NUM}"
            fi
            # ⚡ Pour les PR : Build ultra rapide AMD64 (pas d'émulation QEMU)
            PLATFORMS="linux/amd64"
            NEEDS_QEMU="false"
          else
            if [ "$BRANCH" = "develop" ]; then
              TAG="develop-${BASE_VERSION}-rc.${{ github.run_number }}"
            else
              IS_PRERELEASE="false"
              TAG="v${BASE_VERSION}"
            fi
            # Multi-arch uniquement sur les merges
            PLATFORMS="linux/amd64,linux/arm64"
            NEEDS_QEMU="true"
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT
          echo "platforms=${PLATFORMS}" >> $GITHUB_OUTPUT
          echo "needs_qemu=${NEEDS_QEMU}" >> $GITHUB_OUTPUT

      # 2. Métadonnées Docker
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.vars.outputs.is_prerelease == 'false' }}

      # 3. Charger QEMU UNIQUEMENT si du multi-arch est nécessaire
      - name: Set up QEMU
        if: steps.vars.outputs.needs_qemu == 'true'
        uses: docker/setup-qemu-action@v3

      # 4. Setup Docker Buildx avec moteur de cache activé
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Connexion GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Build & Push optimisé avec double cache GitHub Actions
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ steps.vars.outputs.platforms }}
          build-args: |
            APP_ENV=prod
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ⚡ Rétention et réutilisation des calques Docker
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. Publication de la Release GitHub
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          prerelease: ${{ steps.vars.outputs.is_prerelease == 'true' }}
          generate_release_notes: true