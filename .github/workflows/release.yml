name: Docker Build & Release Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  docker-release:
    name: Build Docker & Manage Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Calcul du tag et du type de release pour GitHub Releases
      - name: Compute Tag and Release Type
        id: vars
        run: |
          EVENT_NAME="${{ github.event_name }}"
          PR_NUM="${{ github.event.number }}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH="${{ github.base_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi

          BASE_VERSION=$(jq -r '.version // "1.0.0"' back/composer.json)
          IS_PRERELEASE="true"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$BRANCH" = "develop" ]; then
              TAG="pr-rc-${PR_NUM}"
            else
              TAG="master-${BASE_VERSION}-rc.${PR_NUM}"
            fi
          else
            if [ "$BRANCH" = "develop" ]; then
              TAG="develop-${BASE_VERSION}-rc.${{ github.run_number }}"
            else
              IS_PRERELEASE="false"
              TAG="v${BASE_VERSION}"
            fi
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

      # 2. Action officielle Docker pour extraire les métadonnées et tags GHCR
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.vars.outputs.is_prerelease == 'false' }}

      # 3. Setup QEMU & Buildx
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Connexion GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build et Push Multi-arch
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_ENV=prod
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 6. Release GitHub
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          prerelease: ${{ steps.vars.outputs.is_prerelease == 'true' }}
          generate_release_notes: true