name: Docker Build & Release Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker-release:
    name: Build Docker & Manage Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Lecture de la version du composer.json et calcul des tags
      - name: Compute Tag and Release Type
        id: vars
        run: |
          EVENT_NAME="${{ github.event_name }}"
          REF_NAME="${{ github.ref_name }}"
          TARGET_BRANCH="${{ github.base_ref }}"
          PR_NUM="${{ github.event.number }}"

          # Extraction de la version dans back/composer.json (fallback sur 1.0.0)
          BASE_VERSION=$(jq -r '.version // "1.0.0"' back/composer.json)

          if [ "$EVENT_NAME" = "pull_request" ]; then
            IS_PRERELEASE="true"
            if [ "$TARGET_BRANCH" = "develop" ]; then
              TAG="pr-rc-${PR_NUM}"
            elif [ "$TARGET_BRANCH" = "main" ]; then
              TAG="master-${BASE_VERSION}-rc.${PR_NUM}"
            fi
            DOCKER_TAGS="ghcr.io/${{ github.repository }}:${TAG}"

          elif [ "$EVENT_NAME" = "push" ]; then
            if [ "$REF_NAME" = "develop" ]; then
              IS_PRERELEASE="true"
              # Version basée sur composer.json + numéro de run GitHub (ex: develop-1.1.0-rc.4)
              TAG="develop-${BASE_VERSION}-rc.${{ github.run_number }}"
              DOCKER_TAGS="ghcr.io/${{ github.repository }}:${TAG}"

            elif [ "$REF_NAME" = "main" ]; then
              IS_PRERELEASE="false"
              # Release officielle
              TAG="v${BASE_VERSION}"
              DOCKER_TAGS="ghcr.io/${{ github.repository }}:${TAG},ghcr.io/${{ github.repository }}:latest"
            fi
          fi

          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> $GITHUB_ENV
          echo "DOCKER_TAGS=${DOCKER_TAGS}" >> $GITHUB_ENV

      # 2. Configuration Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Authentification GHCR
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Build et Push de l'image Docker
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_ENV=prod
          tags: ${{ env.DOCKER_TAGS }}

      # 5. Publication de la Release GitHub
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true